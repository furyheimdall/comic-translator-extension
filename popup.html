<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>만화 번역</title>
  <link rel="stylesheet" href="popup.css">
  <script src="popup.js" defer></script>
</head>
<body>
  <header><span class="mark" aria-hidden="true">文</span><div><h1>만화 번역</h1><p>일본어 → 한국어 · 내 서버 · <span id="version"></span></p></div></header>
  <main>
    <section class="tab-panel" aria-labelledby="tab-title">
      <div class="row"><h2 id="tab-title">현재 탭</h2><label class="toggle"><span>이 탭 번역</span><input type="checkbox" id="enabled"></label></div>
      <p id="site" class="muted">탭 확인 중…</p>
      <label class="check"><input type="checkbox" id="autoSite"> 이 사이트에서 항상 켜기</label>
      <div class="counts" aria-live="polite"><div><b id="queued">0</b><span>대기</span></div><div><b id="processing">0</b><span>번역 중</span></div><div><b id="done">0</b><span>완료</span></div><div><b id="failed">0</b><span>실패</span></div></div>
      <p id="sessionMessage" class="status" aria-live="polite">번역이 꺼져 있습니다.</p>
      <button type="button" id="originals" class="secondary" disabled>원본 보기</button>
      <p class="hint">이미지만 번역하려면 이미지에서 오른쪽 클릭 → <b>이 이미지 번역</b>.</p>
    </section>
    <section aria-labelledby="summary-title">
      <h2 id="summary-title">연결</h2>
      <dl class="summary">
        <dt>서버</dt><dd id="summaryServer">설정 안 됨</dd>
        <dt>번역</dt><dd id="summaryLlm">설정 안 됨</dd>
      </dl>
      <p id="setupNeeded" class="status error" hidden>먼저 설정에서 서버와 페어링하고 번역 제공자를 고르세요.</p>
      <button type="button" id="openOptions">설정 열기</button>
      <p id="feedback" class="status" role="alert"></p>
    </section>
  </main>
</body>
</html>
